org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# 8 logical cores, 15.7 GB RAM. Leave headroom for the rest of the machine, but
# nothing like the old cap of 2 — that existed to dodge Avast, not to save CPU.
