org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Low-spec machine: cap parallel workers so builds don't starve the rest of the PC
org.gradle.workers.max=2
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
android.useAndroidX=true
android.nonTransitiveRClass=true
# Avast re-signs all HTTPS on this machine, so Java rejects every download until
# it is told to trust Avast's root CA. This store is a copy of the JDK's own
# cacerts (every normal public root) with the Avast root added on top — so a
# rotated *server* certificate can never break the build, only a rotated Avast
# root can. Rebuild it with the recipe in CLAUDE.md if that happens.
#
# Do NOT use trustStoreType=Windows-ROOT with trustStore=NONE — Gradle's SSL
# factory crashes on it. This is the approach that actually works.
systemProp.javax.net.ssl.trustStore=C\:\\Users\\mutal\\thrum\\build-truststore.p12
systemProp.javax.net.ssl.trustStorePassword=routines
systemProp.javax.net.ssl.trustStoreType=PKCS12
